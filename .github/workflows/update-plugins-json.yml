name: Update plugins.json

on:
  push:
    branches:
      - main
    paths:
      - "plugins/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-plugins-json-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-plugins-json:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rebuild plugins.json
        run: |
          python scripts/update_plugins_json.py \
            --repository "${{ github.repository }}" \
            --branch "${{ github.ref_name }}"

      - name: Commit plugins.json when changed
        run: |
          if git diff --quiet -- plugins.json; then
            echo "plugins.json is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins.json
          git commit -m "Update plugins.json"
          git push
